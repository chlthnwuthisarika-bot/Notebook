<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สมุดบันทึก</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1e24;--mut:#6b7280;--ac:#2563eb;--acx:#fff;--bd:#e3e6eb;--ok:#16a34a;--no:#dc2626;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101216;--card:#1a1d23;--tx:#eceef2;--mut:#9aa1ad;--ac:#5b8cff;--acx:#0b1020;--bd:#2a2e36;--ok:#22c55e;--no:#f87171}}
:root[data-theme="dark"]{--bg:#101216;--card:#1a1d23;--tx:#eceef2;--mut:#9aa1ad;--ac:#5b8cff;--acx:#0b1020;--bd:#2a2e36;--ok:#22c55e;--no:#f87171}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;font-size:16px;line-height:1.45;max-width:640px;margin-inline:auto;padding-bottom:100px}
header{padding:14px 16px 8px}
h1{margin:0 0 8px;font-size:22px}
input,textarea,select{width:100%;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
textarea{resize:vertical;min-height:80px}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--ac);color:var(--acx);font-weight:600}
button.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
button.g{background:transparent;color:var(--no);padding:4px 8px}
.cal{margin-top:10px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ch button{padding:6px 14px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cg i{font-style:normal;color:var(--mut);font-size:12px}
.dy{background:var(--bg);color:var(--tx);border:1px solid var(--bd);padding:4px 0;min-height:46px;font-weight:500;border-radius:10px}
.dy.td{font-weight:800;color:var(--ac)}
.dy.on{outline:2px solid var(--ac)}
.dy u{display:block;text-decoration:none;margin:2px auto 0;width:max-content;min-width:18px;background:var(--ok);color:#fff;font-size:11px;line-height:16px;border-radius:99px;padding:0 5px}
.list{padding:8px 16px;display:grid;gap:12px}
.dh{padding:6px 4px 0;color:var(--mut);font-weight:600;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--no);border-radius:16px;overflow:hidden}
.card.ok{border-left-color:var(--ok)}
.gal{display:flex;gap:2px}
.card .gal img{flex:1;min-width:0;height:200px;object-fit:cover;display:block}
.cb{padding:12px 14px}
